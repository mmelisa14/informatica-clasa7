<!doctype html>
<html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Misiunea Word</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Concept: caiet de matematică (pătrățele) + fereastra Word în miniatură, ca teren de joacă pentru clasa a VII-a */
:root{
  --paper:#f4f7fb; --grid:#d9e1ef; --ink:#14213a; --muted:#56637d;
  --card:#ffffff; --line:#c3cfe3; --blue:#2b579a; --blue-ink:#ffffff;
  --hi:#ffe14d; --hi-ink:#3a2f00;
  --good:#17693f; --good-bg:#def3e8; --bad:#a82019; --bad-bg:#fbe5e3;
  --win-bar:#2b579a; --win-gray:#dde1e8; --ribbon:#f1f3f7; --ribbon-line:#c9ced8;
  --page:#ffffff; --page-ink:#1b1b1b; --key:#eef2f9; --key-line:#9fb0cc;
  --f-d:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-b:"Figtree",system-ui,"Segoe UI",sans-serif;
  --f-m:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f1521; --grid:#1a2335; --ink:#e8eefb; --muted:#9aa8c4;
  --card:#172033; --line:#2c3a57; --blue:#3f6fc4; --blue-ink:#ffffff;
  --good:#7fe0ac; --good-bg:#12301f; --bad:#ff9a92; --bad-bg:#3a1a18;
  --win-bar:#264a85; --win-gray:#2b3140; --ribbon:#232a38; --ribbon-line:#3a4356;
  --key:#202b44; --key-line:#4a5d86; color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#0f1521; --grid:#1a2335; --ink:#e8eefb; --muted:#9aa8c4;
  --card:#172033; --line:#2c3a57; --blue:#3f6fc4; --blue-ink:#ffffff;
  --good:#7fe0ac; --good-bg:#12301f; --bad:#ff9a92; --bad-bg:#3a1a18;
  --win-bar:#264a85; --win-gray:#2b3140; --ribbon:#232a38; --ribbon-line:#3a4356;
  --key:#202b44; --key-line:#4a5d86; color-scheme:dark;}

*{box-sizing:border-box}
body{background-color:var(--paper);color:var(--ink);font-family:var(--f-b);font-size:16px;line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;padding-inline:16px;padding-block:18px 48px;min-height:100vh}
.wrap{max-width:980px;margin-inline:auto}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
h1,h2,h3{font-family:var(--f-d);line-height:1.1;text-wrap:balance;margin:0}
p{margin:0}

/* bară sus */
.bar{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.brand{font-family:var(--f-d);font-weight:800;font-size:1.25rem;letter-spacing:-.01em}
.brand i{font-style:normal;background:var(--hi);color:var(--hi-ink);padding:0 .3em;border-radius:3px}
.crumb{font-family:var(--f-d);font-weight:700;flex:1;min-width:0}
.xp{font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.xp b{color:var(--ink)}
.btn{background:var(--blue);color:var(--blue-ink);border:0;border-radius:8px;padding:.7em 1.2em;font-weight:700;box-shadow:0 3px 0 rgba(0,0,0,.28);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.sm{padding:.4em .8em;font-size:.9rem}
.btn[disabled]{opacity:.5;cursor:default}

/* start */
.start{display:grid;gap:22px;margin-top:6vh;max-width:640px}
.start h1{font-size:clamp(2.4rem,9vw,4.4rem);font-weight:800;letter-spacing:-.03em}
.start h1 mark{background:var(--hi);color:var(--hi-ink);padding:0 .12em;border-radius:4px}
.lead{color:var(--muted);font-size:1.1rem;max-width:56ch}
.namebox{display:flex;gap:10px;flex-wrap:wrap}
.namebox input{flex:1;min-width:200px;font:inherit;font-size:1.1rem;padding:.7em .9em;border-radius:8px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.facts{display:flex;gap:8px;flex-wrap:wrap;margin:0;padding:0;list-style:none}
.facts li{font-size:.85rem;border:1.5px dashed var(--line);border-radius:999px;padding:.2em .8em;color:var(--muted)}

/* hartă */
.h1{font-size:clamp(1.8rem,5vw,2.6rem);font-weight:800;margin-bottom:6px}
.hubgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;margin-block:20px}
.lcard{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:16px;text-align:left;display:grid;gap:8px;align-content:start;min-width:0;transition:transform .12s,border-color .12s}
.lcard:hover{transform:translateY(-3px);border-color:var(--blue)}
.lcard .n{font-family:var(--f-d);font-weight:800;font-size:2.4rem;line-height:1;color:var(--blue)}
.lcard h3{font-size:1.2rem}
.lcard p{color:var(--muted);font-size:.93rem}
.stars{display:flex;gap:3px}
.stars svg{width:20px;height:20px;fill:none;stroke:var(--key-line);stroke-width:1.5}
.stars svg.on{fill:var(--hi);stroke:#b89a00}
.rankline{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.pill{background:var(--hi);color:var(--hi-ink);font-weight:700;border-radius:999px;padding:.15em .8em;font-size:.9rem}

/* nivel */
.prog{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:14px}
.prog i{display:block;height:100%;width:0;background:var(--blue);transition:width .3s}
.mission{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:14px}
.tag{font-family:var(--f-m);font-weight:700;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;background:var(--hi);color:var(--hi-ink);padding:.15em .6em;border-radius:3px}
.mission p{font-size:1.12rem;font-weight:600;flex:1;min-width:220px}
.stage{min-width:0}
.fb{margin-top:14px;border-radius:10px;padding:12px 14px;font-weight:500;border:2px solid}
.fb.good{background:var(--good-bg);color:var(--good);border-color:var(--good)}
.fb.bad{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.fb.hint{background:var(--card);color:var(--ink);border-color:var(--line)}
.fb b{font-weight:800}
.actions{margin-top:14px;display:flex;justify-content:flex-end}
kbd{font-family:var(--f-m);font-weight:700;font-size:.85em;background:var(--key);border:1.5px solid var(--key-line);border-bottom-width:4px;border-radius:6px;padding:.05em .5em;display:inline-block;color:var(--ink)}
.plus{color:var(--muted);margin-inline:.2em}

.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.opt{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:.9em 1em;text-align:left;font-weight:600;min-width:0}
.opt:hover:not([disabled]){border-color:var(--blue)}
.opt.ok{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.opt.no{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);opacity:.8}
.opt[disabled]{cursor:default}

/* fereastra Word */
.winscroll{overflow-x:auto;padding-bottom:4px}
.win{min-width:0;border:1px solid var(--ribbon-line);border-radius:8px;overflow:hidden;background:var(--win-gray);box-shadow:0 6px 0 rgba(0,0,0,.12);font-size:12.5px;color:var(--ink)}
.win [data-part]{cursor:pointer;position:relative}
.win [data-part]:hover{outline:2px dashed var(--hi);outline-offset:-2px}
.w-title{background:var(--win-bar);color:#fff;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:6px 10px;min-height:34px}
.w-qa{display:flex;gap:10px;padding:3px 6px;align-items:center}
.w-qa svg,.w-search svg{width:15px;height:15px}
.w-name{flex:1;text-align:center;font-weight:600}
.w-search{background:rgba(255,255,255,.22);border-radius:4px;padding:3px 10px;display:flex;gap:6px;align-items:center;min-width:130px}
.w-acct{width:24px;height:24px;border-radius:50%;background:#fff;color:var(--win-bar);font-weight:800;display:grid;place-items:center;font-size:10px}
.w-ctl{letter-spacing:.8em;font-size:13px}
.w-tabs{display:flex;flex-wrap:wrap;background:var(--win-bar);padding-inline:6px;gap:2px}
.w-tab{padding:6px 10px 5px;color:#fff;white-space:nowrap;border:0;background:transparent;border-radius:4px 4px 0 0;font-size:12.5px}
.w-tab.act{background:var(--ribbon);color:var(--ink);font-weight:700}
.w-tab.file{background:rgba(0,0,0,.2)}
.w-rib{background:var(--ribbon);display:flex;flex-wrap:wrap;min-height:84px;border-bottom:1px solid var(--ribbon-line)}
.w-grp{padding:6px 10px 3px;border-right:1px solid var(--ribbon-line);border-bottom:1px solid var(--ribbon-line);display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.w-cmds{display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start;max-width:210px}
.w-cmd{background:var(--card);border:1px solid var(--ribbon-line);border-radius:3px;padding:2px 6px;font-size:11px;white-space:nowrap;color:var(--ink)}
.w-glabel{font-size:10.5px;text-align:center;color:var(--muted);margin-top:4px;white-space:nowrap}
.w-body{display:flex;height:150px}
.w-doc{flex:1;display:grid;place-items:start center;padding:10px;overflow:hidden}
.w-page{background:var(--page);color:var(--page-ink);width:70%;min-width:260px;padding:14px 18px;height:200px;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.w-page h4{font-family:Georgia,serif;margin:0 0 6px;font-size:16px;text-align:center}
.w-page p{font-family:Georgia,serif;font-size:11.5px;margin:0;line-height:1.5}
.w-scroll{width:16px;background:var(--ribbon);border-left:1px solid var(--ribbon-line);padding:3px 3px}
.w-scroll i{display:block;height:48px;background:var(--key-line);border-radius:2px}
.w-status{display:flex;gap:18px;align-items:center;background:var(--ribbon);border-top:1px solid var(--ribbon-line);padding:3px 10px;font-size:11.5px}
.w-status .sp{flex:1}
.w-status span[data-part]{padding:2px 6px}
.zoomctl{display:inline-flex;gap:6px;align-items:center}
.zoomctl i{display:block;width:70px;height:2px;background:var(--muted);position:relative}
.zoomctl i::after{content:"";position:absolute;left:50%;top:-4px;width:4px;height:10px;background:var(--ink)}
.win .pinned{outline:2px solid var(--hi);outline-offset:-2px}
.pin{position:absolute;right:6px;bottom:3px;background:var(--hi);color:var(--hi-ink);font:700 11px var(--f-b);font-style:normal;padding:1px 7px;border-radius:3px;pointer-events:none;z-index:3;white-space:nowrap}
.w-title .pin{bottom:auto;top:3px;right:auto;left:40%}
.w-tabs-wrap{position:relative}

/* imagine + mânere */
.docmock{background:var(--win-gray);border-radius:8px;padding:18px 20px;display:grid;justify-items:center;gap:12px}
.docpage{background:var(--page);width:min(100%,430px);padding:22px 26px 26px;display:grid;gap:10px;justify-items:center;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.docpage .ln{width:100%;display:grid;gap:5px}
.docpage .ln i{display:block;height:6px;background:#c8ccd4;border-radius:3px}
.docpage .ln i.s{width:62%}
.picwrap{padding:26px 28px}
.picbox{position:relative;width:240px;height:150px;outline:2px solid #1f6feb;outline-offset:0}
.picbox svg.scene{display:block;width:100%;height:100%}
.hd{position:absolute;width:15px;height:15px;background:#fff;border:2px solid #1f6feb;border-radius:50%;padding:0;transform:translate(-50%,-50%)}
.hd:hover,.hd.hot{background:var(--hi)}
.hd.ok{background:#3ecf8e}
.hd.rot{left:50%;top:-22px;width:22px;height:22px;display:grid;place-items:center;border-radius:50%}
.hd.rot svg,.hd.wrap svg{width:13px;height:13px}
.hd.wrap{left:calc(100% + 24px);top:6px;width:24px;height:24px;border-radius:4px;display:grid;place-items:center}
.hd.h{left:100%;top:50%}.hd.v{left:50%;top:100%}
.hd.p.a{left:0;top:0}.hd.p.b{left:100%;top:0}.hd.p.c{left:0;top:100%}.hd.p.d{left:100%;top:100%}
.hd.side{border-radius:4px}

/* formatare */
.editor{border:1px solid var(--ribbon-line);border-radius:8px;overflow:hidden;background:var(--win-gray);box-shadow:0 6px 0 rgba(0,0,0,.12)}
.tb{display:flex;flex-wrap:wrap;background:var(--ribbon);border-bottom:1px solid var(--ribbon-line);padding:6px 6px 0}
.tgrp{padding:2px 10px 4px;border-right:1px solid var(--ribbon-line);display:flex;flex-direction:column;gap:3px;align-items:center}
.tgrp:last-child{border-right:0}
.tgrp>span{font-size:10.5px;color:var(--muted)}
.trow{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}
.tbtn{min-width:34px;height:34px;background:var(--card);color:var(--ink);border:1.5px solid var(--ribbon-line);border-radius:5px;display:grid;place-items:center;padding:0 7px;font-family:Georgia,serif;font-size:1rem}
.tbtn:hover{border-color:var(--blue);background:var(--key)}
.tbtn .hlico{background:#ffe14d;color:#222;padding:0 4px;font-family:var(--f-b);font-weight:700;font-size:.8rem}
.tbtn .colico{color:#c0392b;font-weight:800;font-family:var(--f-b);border-bottom:3px solid #c0392b;line-height:1}
.tbtn.undo{font-family:var(--f-b);font-size:.85rem;font-weight:600}
.tbtn svg{width:16px;height:14px}
.canvas{padding:14px;display:grid;place-items:start center}
.page{background:var(--page);color:var(--page-ink);width:min(100%,640px);padding:22px 26px;font-family:Georgia,"Times New Roman",serif;font-size:1.02rem;line-height:1.6;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.page .blk{margin:0 0 .6em;cursor:text;padding:2px 4px;border-radius:2px}
.page h2.blk{font-size:1.6rem;margin-bottom:.4em}
.page .w{cursor:text;border-radius:2px}
.page .blk:hover,.page .w:hover{background:rgba(31,111,235,.1)}
.page .sel{background:#b4d5fe !important;outline:1px solid #1f6feb}
.page .b{font-weight:700}.page .i{font-style:italic}.page .u{text-decoration:underline}.page .s{text-decoration:line-through}
.page .sub{vertical-align:sub;font-size:.72em}.page .sup{vertical-align:super;font-size:.72em}
.page .hl{background:#ffe14d}.page .col{color:#c0392b}
.page .al-l{text-align:left}.page .al-c{text-align:center}.page .al-r{text-align:right}.page .al-j{text-align:justify}
.page .list{display:list-item;list-style:disc;margin-left:1.5em}

/* greșeli */
.passage{background:var(--page);color:var(--page-ink);font-family:Georgia,serif;font-size:1.15rem;line-height:2.1;padding:18px 20px;border-radius:8px;border:2px solid var(--line)}
.tok{display:inline;background:transparent;border:0;border-radius:4px;padding:2px 1px;font:inherit;color:inherit;white-space:pre-wrap;cursor:pointer}
.tok:hover{background:rgba(255,225,77,.55)}
.tok.mark{background:#ffe14d;text-decoration:underline wavy #d33;text-underline-offset:4px}
.tok.hit{background:#c9f0da;text-decoration:none;outline:2px solid #1b8a54}
.tok.miss{background:#ffd9d6;outline:2px dashed #c0392b}
.tok.fals{background:#e5e5e5;text-decoration:line-through}
.hunt-bar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.why{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:6px;font-size:.95rem}
.why li{background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:.5em .8em}
.why code{font-family:var(--f-m);background:var(--key);padding:0 .35em;border-radius:3px}

/* rebus */
.rb{display:grid;gap:14px}
.rbrow{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:8px;min-width:0}
.rbrow.done{border-color:var(--good)}
.rbtop{display:flex;gap:12px;align-items:center}
.rbnum{font-family:var(--f-d);font-weight:800;font-size:1.4rem;width:1.6em;color:var(--blue)}
.cells{display:grid;grid-template-columns:repeat(9,30px);gap:3px}
.cell{width:30px;height:30px;border:2px solid transparent;border-radius:3px;display:grid;place-items:center;font-family:var(--f-m);font-weight:700;font-size:1.05rem;color:var(--page-ink)}
.cell.on{background:var(--page);border-color:var(--ink)}
.cell.key{background:var(--hi);color:var(--hi-ink);border-color:var(--ink)}
.cells{overflow-x:auto;padding-bottom:2px}
.rbclue{font-size:.95rem;color:var(--muted)}
.rbin{display:flex;gap:8px;flex-wrap:wrap}
.rbin input{flex:1;min-width:140px;font:inherit;padding:.5em .7em;border:2px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);text-transform:uppercase;letter-spacing:.1em}
.rbmsg{font-size:.88rem;color:var(--bad);min-height:1.2em}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.vert{display:flex;gap:6px;justify-content:center;margin-top:6px}
.vert .cell{width:44px;height:44px;font-size:1.5rem;background:var(--hi);color:var(--hi-ink);border-color:var(--ink);animation:pop .4s both}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}

/* rezultate + diplomă */
.res{display:grid;gap:16px;justify-items:start;margin-top:4vh;max-width:620px}
.res .big{display:flex;gap:8px}
.res .big svg{width:60px;height:60px;fill:none;stroke:var(--key-line);stroke-width:1.5}
.res .big svg.on{fill:var(--hi);stroke:#b89a00;animation:pop .5s both}
.res .big svg:nth-child(2){animation-delay:.15s}.res .big svg:nth-child(3){animation-delay:.3s}
.res h2{font-size:clamp(1.8rem,6vw,2.8rem);font-weight:800}
.row{display:flex;gap:10px;flex-wrap:wrap}
.recap{background:var(--card);border:2px dashed var(--line);border-radius:12px;padding:12px 14px;color:var(--muted)}
.dip{background:var(--card);color:var(--ink);border:3px double var(--blue);outline:2px solid var(--blue);outline-offset:6px;border-radius:6px;padding:clamp(20px,5vw,48px);text-align:center;display:grid;gap:12px;max-width:720px;margin:24px auto}
.dip small{font-family:var(--f-m);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.dip h2{font-size:clamp(1.8rem,7vw,3rem);font-weight:800}
.dip .nm{font-family:var(--f-d);font-weight:800;font-size:clamp(2rem,8vw,3.4rem);background:linear-gradient(transparent 62%,var(--hi) 62%);justify-self:center;padding-inline:.2em;color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
<div id="app"></div>
<script>
(function(){
"use strict";
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var app=$('#app');
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function sum(a){return a.reduce(function(x,y){return x+y},0)}
function norm(s){return String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().trim()}

/* ---------- progres ---------- */
var KEY='misiunea-word-v1';
var S={name:'',best:[0,0,0,0,0,0,0],stars:[0,0,0,0,0,0,0]};
try{var raw=JSON.parse(localStorage.getItem(KEY));if(raw&&raw.best&&raw.stars){S=raw}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var TOT=[9,10,10,8,12,15,5], MAXXP=sum(TOT)*10;
function rankOf(xp){var r=xp/MAXXP;return r>=.88?'Maestru Word':r>=.65?'Expert Word':r>=.42?'Tehnoredactor':r>=.18?'Utilizator':'Începător'}
function starSvg(on){return '<svg viewBox="0 0 24 24" class="'+(on?'on':'')+'"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3 6.1 20.6l1.3-6.6L2.5 9.4l6.6-.8z" stroke-linejoin="round"/></svg>'}

function shell(idx){
  clearKeys();
  app.innerHTML='<div class="wrap"><header class="bar"><button class="btn ghost sm" id="back">← Harta</button><div class="crumb">Nivelul '+(idx+1)+' · '+LV[idx].t+'</div><div class="xp"><b>'+sum(S.best)+'</b> XP</div></header>'+
  '<div class="prog"><i id="pf"></i></div>'+
  '<section class="mission"><span class="tag">Misiune</span><p id="pr"></p></section>'+
  '<div id="stage" class="stage"></div><div id="fb" class="fb" role="status" aria-live="polite" hidden></div>'+
  '<div class="actions"><button class="btn" id="next" hidden></button></div></div>';
  $('#back').onclick=hub;window.scrollTo(0,0);
}
function play(idx,items,renderItem,setup){
  shell(idx);
  var R={ok:0,fail:0,total:items.reduce(function(a,x){return a+(x.w||1)},0)};
  var stage=$('#stage'),fb=$('#fb'),next=$('#next'),pr=$('#pr'),pf=$('#pf');
  var i=0;
  if(setup)setup(stage);
  function show(){
    fb.hidden=true;next.hidden=true;
    pf.style.width=(i/items.length*100)+'%';
    var tried=false,fin=false;
    var it=items[i];
    function reveal(cls,html){fb.className='fb '+cls;fb.innerHTML=html;fb.hidden=false}
    function ready(){next.hidden=false;next.textContent=(i===items.length-1)?'Vezi rezultatul →':'Continuă →';next.focus()}
    var api={stage:stage,
      prompt:function(h){pr.innerHTML=h},
      hint:function(h){reveal('hint',h)},
      right:function(msg){if(fin)return;fin=true;if(!tried)R.ok+=(it.w||1);tried=true;reveal('good','<b>Corect!</b> '+(msg||''));ready()},
      wrong:function(msg){if(fin)return;if(!tried){R.fail++;tried=true}reveal('bad','<b>Încă nu.</b> '+(msg||'Mai încearcă.'))},
      partial:function(n,html){if(fin)return;fin=true;tried=true;R.ok+=n;reveal('good',html);ready()}
    };
    if(!setup)stage.innerHTML='';
    renderItem(it,api,i);
  }
  next.onclick=function(){i++;if(i>=items.length){pf.style.width='100%';results(idx,R)}else{show();window.scrollTo(0,0)}};
  show();
}
function mcq(api,it){
  var opts=shuffle(it.o.map(function(t,k){return {t:t,ok:k===0}}));
  api.stage.innerHTML='<div class="opts">'+opts.map(function(o,k){return '<button class="opt" data-k="'+k+'">'+o.t+'</button>'}).join('')+'</div>';
  var done=false;
  $$('.opt',api.stage).forEach(function(b,k){b.onclick=function(){
    if(done)return;
    if(opts[k].ok){done=true;b.classList.add('ok');$$('.opt',api.stage).forEach(function(x){x.disabled=true});api.right(it.fact)}
    else{b.classList.add('no');b.disabled=true;api.wrong(it.hint||'Nu este varianta aceasta. Încearcă alta.')}
  }});
}
function results(idx,R){
  var ratio=R.ok/R.total, n=ratio>=.9?3:ratio>=.6?2:1, gain=R.ok*10;
  S.best[idx]=Math.max(S.best[idx],gain);S.stars[idx]=Math.max(S.stars[idx],n);save();
  var msg=n===3?'Perfect! Ești gata de concurs.':n===2?'Foarte bine! Mai încearcă o dată pentru trei stele.':'Ai terminat misiunea. Rejoacă pentru mai multe stele.';
  var all=S.stars.every(function(s){return s>0});
  app.innerHTML='<div class="wrap"><header class="bar"><div class="brand">Misiunea <i>Word</i></div><div class="xp"><b>'+sum(S.best)+'</b> XP</div></header>'+
  '<div class="res">'+stars(n,'big')+'<h2>'+msg+'</h2><p class="lead">Din prima ai răspuns corect la <b>'+R.ok+' din '+R.total+'</b>. Ai câștigat <b>'+gain+' XP</b>.</p>'+
  '<div class="recap"><b>Reține:</b> '+LV[idx].r+'</div>'+
  '<div class="row"><button class="btn" id="nx">'+(idx<LV.length-1?'Misiunea următoare →':all?'Primește diploma':'Harta')+'</button><button class="btn ghost" id="rp">Joacă din nou</button><button class="btn ghost" id="hb">Harta</button></div></div></div>';
  $('#nx').onclick=function(){if(idx<LV.length-1)LV[idx+1].run();else if(all)diploma();else hub()};
  $('#rp').onclick=function(){LV[idx].run()};$('#hb').onclick=hub;window.scrollTo(0,0);
}

function parseTxt(){
  var out=[],re=/\[\[(.+?)\|(.+?)\]\]/g,last=0,m;
  function words(s){s.split(/\s+/).forEach(function(w){if(w)out.push({w:w})})}
  while((m=re.exec(TXT))){words(TXT.slice(last,m.index));out.push({w:m[1],e:m[2]});last=m.index+m[0].length}
  words(TXT.slice(last));return out;
}

      var cells='';for(var j=0;j<9;j++){var k=j-off[n];if(k>=0&&k<r.w.length)cells+='<span class="cell on'+(k===r.i?' key':'')+'" id="c'+n+'_'+k+'"></span>';else cells+='<span class="cell"></span>'}
      return '<div class="rbrow" id="r'+n+'"><div class="rbtop"><span class="rbnum">'+(n+1)+'</span><div class="cells">'+cells+'</div></div><div class="rbclue">'+r.c+' <span class="xp">('+r.w.length+' litere)</span></div>'+
        '<div class="rbin"><input id="in'+n+'" autocomplete="off" aria-label="Răspuns '+(n+1)+'" maxlength="12"><button class="btn sm" data-ck="'+n+'">Verifică</button><button class="btn ghost sm" data-hn="'+n+'">Indiciu</button></div><div class="rbmsg" id="m'+n+'"></div></div>';
    }).join('')+'<div id="vt"></div></div>';
    function fill(n){var r=RB[n];for(var k=0;k<r.w.length;k++)$('#c'+n+'_'+k).textContent=r.w[k]}
    function check(n){
      if(solved[n])return;
      var v=norm($('#in'+n).value);if(!v)return;
      if(v===RB[n].w){
        solved[n]=true;fill(n);$('#r'+n).classList.add('done');$('#in'+n).disabled=true;$('#m'+n).textContent='';
        if(!first[n]&&!hinted[n])score++;cnt++;
        if(cnt===RB.length){
          var vw='TABEL';
          $('#vt').innerHTML='<p style="text-align:center;font-weight:700;margin-top:6px">Pe verticală se formează:</p><div class="vert">'+vw.split('').map(function(ch,z){return '<span class="cell" style="animation-delay:'+(z*.12)+'s">'+ch+'</span>'}).join('')+'</div>';
          api.partial(score,'<b>TABEL!</b> Ai rezolvat rebusul. Din prima, fără indiciu: '+score+' din 5. Tabelul se inserează din Inserare → Tabel și se formatează cu filele Proiectare tabel și Aspect.');
        }
      }else{
        first[n]=true;var row=$('#r'+n);row.classList.remove('shake');void row.offsetWidth;row.classList.add('shake');
        $('#m'+n).textContent='Nu este încă. Cuvântul are '+RB[n].w.length+' litere.';
      }
    }
    $$('[data-ck]',api.stage).forEach(function(b){b.onclick=function(){check(+b.dataset.ck)}});
    $$('[data-hn]',api.stage).forEach(function(b){b.onclick=function(){var n=+b.dataset.hn;if(solved[n])return;hinted[n]=true;$('#c'+n+'_0').textContent=RB[n].w[0];$('#m'+n).style.color='var(--muted)';$('#m'+n).textContent='Începe cu litera '+RB[n].w[0]+'.'}});
    RB.forEach(function(r,n){$('#in'+n).addEventListener('keydown',function(e){if(e.key==='Enter')check(n)})});
  });
}

start();
})();
</script>

</html>
